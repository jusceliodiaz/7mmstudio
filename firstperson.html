  <head>

    <meta name="description" content="Explore the development in 3D with immersive navigation across the facade, pool, and leisure areas. High-end interactive archviz." />

    <meta property="og:title" content="Interactive Exterior Tour" />
    <meta property="og:description" content="Navigate the development before visiting the showroom. Immersive archviz tour with aerial, pool, living and garden views." />

    <link rel="canonical" href="https://7mmstudio.com/firstperson.html" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Interactive Exterior Tour" />
    <meta name="twitter:description" content="Navigate the development before visiting the showroom. Immersive archviz tour with aerial, pool, living and garden views." />
    <meta name="twitter:image" content="https://7mmstudio.com/images/og_firstperson.jpg" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3K51DFTX3J"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-3K51DFTX3J");
    </script>
    <link rel="preload" href="images/seq_arch/aereo_to_piscina_00.jpg" as="image" />
    <link rel="preload" href="images/1.webm" as="video" type="video/webm" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="cursor"></div>
    <div id="ring"></div>
    <div id="noise"></div>

    <div id="stage">
      <video id="main-video" muted loop playsinline preload="auto"></video>
      <canvas id="seq-canvas"></canvas>
      <div id="poi-layer"></div>
    </div>

    <div id="scene-tag"></div>
    <div id="track"></div>

    <div id="loader"><span></span><span></span><span></span></div>

    <div id="debug-hud" hidden>
      <span id="debug-mode">DEBUG ON — click for coordinates</span>
      <span id="debug-coords">—</span>
    </div>

    <!-- Floating CTA -->
    <div id="cta-dock">
      <button id="cta-tour" onclick="startTour()">&#9654; <span>Tour</span></button>
      <button id="cta-visit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Book a visit</span>
      </button>
      <a id="cta-whats" href="#" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 018.413 3.488 11.82 11.82 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24z"/>
        </svg>
        <span>WhatsApp</span>
      </a>
    </div>

    <!-- Lead capture modal -->
    <div id="lead-modal" hidden>
      <div id="lead-card">
        <button id="lead-close" aria-label="Close">&times;</button>
        <h3>Book your visit</h3>
        <p>Leave your details and an agent will get in touch.</p>
        <form id="lead-form">
          <input name="nome"  type="text"  placeholder="Name"      required />
          <input name="email" type="email" placeholder="Email"     required />
          <input name="fone"  type="tel"   placeholder="WhatsApp"  required />
          <button type="submit">Schedule a visit</button>
        </form>
        <p id="lead-ok" hidden>Received! We'll be in touch soon. &#x2713;</p>
      </div>
    </div>

    <script src="scenes-fp.js"></script>
    <script src="script-fp.js"></script>
  </body>
</html>
